<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        (function () {
            const langs = navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language || "en"];

            const isItalian = langs.some((lang) =>
                lang.toLowerCase().startsWith("it")
            );

            const target = isItalian ? "index-it.html" : "index-en.html";
            window.location.replace(target);
        })();
    </script>
</head>

<body>
    <p>Redirecting... Choose language: <a href="index-it.html">Italiano</a> | <a href="index-en.html">English</a></p>
</body>

</html>
